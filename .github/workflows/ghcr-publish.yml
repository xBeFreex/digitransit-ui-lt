name: Publish Docker image to GHCR

on:
  push:
    branches:
      - lt-translation
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create buildInfo.js file
        run: |
          echo -e "export const COMMIT_ID = \"${GITHUB_SHA}\";\nexport const BUILD_TIME = \"$(date -Iminutes -u)\";" >app/buildInfo.js

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tags
        run: echo "sha-tag=${GITHUB_SHA:0:7}" >>"$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            CONFIG=lietuva
          tags: |
            ghcr.io/${{ github.repository_owner }}/digitransit-ui-lt:latest
            ghcr.io/${{ github.repository_owner }}/digitransit-ui-lt:${{ steps.tags.outputs.sha-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,oci-mediatypes=true,compression=zstd
          push: true
